worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    map $http_upgrade $pvp_connection {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok\n";
        }
        location ^~ /api/pvp/ {
            # Resolve at request time so a standalone static container can still boot.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $pvp_service pvp:8787;
            proxy_pass http://$pvp_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $pvp_connection;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        # These names can be reused by new art revisions; revalidate on each visit.
        location ~ ^/(art|audio|fonts)/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ \.html$ {
            try_files $uri =404;
            add_header Cache-Control "no-store";
        }
        location ~ /\. { return 404; }
        location ~ \.(js|mjs|css|json|map|webp|png|jpg|jpeg|svg|woff2?|wav|webm|mp3|ogg)$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
