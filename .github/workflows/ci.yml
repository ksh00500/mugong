name: Source and versioned runtime checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_runtime:
        description: Verify Docker/gameplay using versioned public assets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run assets:catalog
      - run: node scripts/audit-github-snapshot.mjs
      - run: npm run check:assets
      - run: npm run typecheck
      - run: npm run test:source
      - name: Compile game with versioned public media
        run: npm run build
  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_runtime
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:assets
      - run: npm test
      - name: Build and start production container
        run: |
          docker build --tag mugong:ci .
          docker run -d --name mugong-ci -p 127.0.0.1:5190:8080 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true mugong:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hosting
        env:
          MUGONG_HOSTING_URL: http://127.0.0.1:5190
          MUGONG_HOSTING_NGINX: '1'
      - name: Container logs
        if: failure()
        run: docker logs mugong-ci || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: hosting-verification
          path: test-results-hosting/
          retention-days: 7
          if-no-files-found: ignore
