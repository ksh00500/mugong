<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ece6d8" />
    <title>무공 · 강호에 나서다</title>
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100dvh;
          display: grid;
          place-content: center;
          text-align: center;
          background: #eee5d2;
          color: #263b32;
          font: 21px/1.6 system-ui;
          padding: 24px;
          box-sizing: border-box;
        "
      >
        <strong style="font-size: 72px">MUGONG · 무공</strong>
        <p id="boot-message">게임을 준비하고 있습니다…</p>
        <button
          id="boot-retry"
          hidden
          onclick="window.location.reload()"
          style="
            min-height: 66px;
            padding: 12px 24px;
            font: inherit;
            color: #fff9eb;
            background: #315548;
            border: 0;
            border-radius: 12px;
          "
        >
          새로고침
        </button>
      </div>
    </div>
    <script>
      (() => {
        const copy = {
          ko: '게임을 준비하고 있습니다…',
          en: 'Preparing the game…',
          ja: 'ゲームを準備しています…',
          'zh-CN': '正在准备游戏…',
          'zh-TW': '正在準備遊戲…',
        };
        let saved;
        try {
          saved = localStorage.getItem('mugong-language-v1');
        } catch {}
        let locale = Object.hasOwn(copy, saved) ? saved : 'en';
        if (!Object.hasOwn(copy, saved)) {
          for (const language of navigator.languages || [navigator.language]) {
            const tag = language.toLowerCase().replaceAll('_', '-');
            if (/^ko(?:-|$)/.test(tag)) {
              locale = 'ko';
              break;
            }
            if (/^en(?:-|$)/.test(tag)) {
              locale = 'en';
              break;
            }
            if (/^ja(?:-|$)/.test(tag)) {
              locale = 'ja';
              break;
            }
            if (/^zh(?:-|$)/.test(tag)) {
              locale = /(?:^|-)(hant|tw|hk|mo)(?:-|$)/.test(tag) ? 'zh-TW' : 'zh-CN';
              break;
            }
          }
        }
        document.documentElement.lang = locale;
        document.getElementById('boot-message').textContent = copy[locale];
        const errorCopy = {
          ko: '연결을 확인한 뒤 새로고침해 주세요.',
          en: 'Check your connection and reload.',
          ja: '接続を確認して再読み込みしてください。',
          'zh-CN': '请检查连接后刷新。',
          'zh-TW': '請檢查連線後重新整理。',
        };
        const retryCopy = {
          ko: '새로고침',
          en: 'Reload',
          ja: '再読み込み',
          'zh-CN': '刷新',
          'zh-TW': '重新整理',
        };
        document.addEventListener(
          'error',
          (event) => {
            if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module')
              return;
            const retry = document.getElementById('boot-retry');
            if (!retry) return;
            document.getElementById('boot-message').textContent = errorCopy[locale];
            retry.textContent = retryCopy[locale];
            retry.hidden = false;
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
