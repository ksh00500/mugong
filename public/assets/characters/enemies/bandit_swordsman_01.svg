<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
<defs>
  <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5a4030"/><stop offset=".5" stop-color="#3a2a24"/><stop offset="1" stop-color="#241b18"/>
  </linearGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6d4a31"/><stop offset=".55" stop-color="#47301f"/><stop offset="1" stop-color="#281c15"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#596064"/><stop offset=".45" stop-color="#d6dbdc"/><stop offset=".75" stop-color="#8b9397"/><stop offset="1" stop-color="#3d4447"/>
  </linearGradient>
  <radialGradient id="skin" cx=".35" cy=".25" r=".8">
    <stop offset="0" stop-color="#c58f6a"/><stop offset=".7" stop-color="#94654d"/><stop offset="1" stop-color="#6b4738"/>
  </radialGradient>
  <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
  </filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>

<!-- transparent background -->
<ellipse cx="384" cy="642" rx="130" ry="34" fill="#000" opacity=".2" filter="url(#shadow)"/>

<!-- rear leg -->
<path d="M394 496 L443 503 L468 615 L428 628 L390 544Z" fill="#262322" stroke="#171413" stroke-width="7" filter="url(#rough)"/>
<path d="M427 614 L470 608 Q490 619 490 633 Q466 646 419 637Z" fill="#181716" stroke="#0d0c0c" stroke-width="6"/>

<!-- front leg -->
