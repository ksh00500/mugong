<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="culm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#263c25"/>
      <stop offset=".22" stop-color="#43613a"/>
      <stop offset=".52" stop-color="#76844c"/>
      <stop offset=".78" stop-color="#405f37"/>
      <stop offset="1" stop-color="#20361f"/>
    </linearGradient>
    <linearGradient id="culmLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#304b2b"/>
      <stop offset=".34" stop-color="#60784a"/>
      <stop offset=".62" stop-color="#8f9660"/>
      <stop offset="1" stop-color="#35532f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3523"/>
      <stop offset=".5" stop-color="#4f6b39"/>
      <stop offset="1" stop-color="#18301e"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#385331"/>
      <stop offset=".5" stop-color="#789054"/>
      <stop offset="1" stop-color="#284229"/>
    </linearGradient>
    <radialGradient id="grass" cx=".5" cy=".25" r=".9">
      <stop offset="0" stop-color="#697345"/>
      <stop offset=".7" stop-color="#39472c"/>
      <stop offset="1" stop-color="#263421"/>
    </radialGradient>
    <filter id="paint" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation=".45"/>
    </filter>

    <g id="leafA">
      <path d="M0 0 C20 -7 47 -7 70 0 C49 8 24 10 0 0Z" fill="url(#leaf)"/>
      <path d="M4 0 C26 0 47 0 66 0" stroke="#18271a" stroke-width="2" opacity=".55"/>
    </g>
    <g id="leafB">
      <path d="M0 0 C14 -6 35 -5 54 1 C37 7 19 8 0 0Z" fill="url(#leafLight)"/>
      <path d="M4 0 C19 0 34 0 50 1" stroke="#203221" stroke-width="1.7" opacity=".5"/>
    </g>
  </defs>

  <!-- transparent asset: only object + its own grounding shadow -->
  <ellipse cx="520" cy="842" rx="250" ry="76" fill="#000" opacity=".20" filter="url(#shadowBlur)"/>
  <ellipse cx="520" cy="829" rx="205" ry="47" fill="#1a2118" opacity=".18"/>

  <!-- base undergrowth -->
  <g filter="url(#paint)">
    <path d="M286 814 C315 746 358 721 396 776 C425 708 488 704 515 775 C548 716 603 715 626 775 C668 713 729 735 748 810 C683 854 344 864 286 814Z" fill="url(#grass)" opacity=".96"/>
    <g stroke-linecap="round" fill="none">
      <path d="M330 821 Q320 773 341 744 M345 824 Q362 774 356 741 M366 828 Q386 783 391 752 M405 832 Q402 776 425 739" stroke="#70804c" stroke-width="8"/>
      <path d="M452 831 Q442 781 463 748 M480 835 Q498 781 492 744 M529 835 Q534 781 555 747 M574 834 Q592 786 596 753" stroke="#647844" stroke-width="8"/>
      <path d="M623 833 Q612 782 635 750 M655 827 Q676 781 670 748 M700 822 Q709 776 728 754" stroke="#53683c" stroke-width="8"/>
    </g>
  </g>

  <!-- rear culms -->
  <g filter="url(#paint)">
    <g transform="translate(344 754) rotate(-7)">
      <rect x="-18" y="-525" width="36" height="560" rx="16" fill="url(#culm)"/>
      <g stroke="#1a301d" stroke-width="7" opacity=".8">
        <path d="M-15 -454 H15"/><path d="M-15 -375 H15"/><path d="M-15 -292 H15"/><path d="M-15 -205 H15"/><path d="M-15 -116 H15"/>
      </g>
      <path d="M-5 -520 L-5 25" stroke="#9aa06e" stroke-width="4" opacity=".45"/>
    </g>
    <g transform="translate(407 777) rotate(-3)">
      <rect x="-20" y="-595" width="40" height="622" rx="18" fill="url(#culmLight)"/>
      <g stroke="#233621" stroke-width="8" opacity=".8">
        <path d="M-16 -516 H16"/><path d="M-16 -430 H16"/><path d="M-16 -338 H16"/><path d="M-16 -244 H16"/><path d="M-16 -146 H16"/><path d="M-16 -51 H16"/>
      </g>
      <path d="M-6 -585 L-7 12" stroke="#c0bc7e" stroke-width="4" opacity=".35"/>
    </g>
    <g transform="translate(475 786) rotate(2)">
      <rect x="-22" y="-650" width="44" height="676" rx="19" fill="url(#culm)"/>
      <g stroke="#233821" stroke-width="8">
        <path d="M-18 -562 H18"/><path d="M-18 -468 H18"/><path d="M-18 -365 H18"/><path d="M-18 -260 H18"/><path d="M-18 -154 H18"/><path d="M-18 -52 H18"/>
      </g>
      <path d="M-8 -640 L-8 11" stroke="#9ca56a" stroke-width="4" opacity=".4"/>
    </g>
    <g transform="translate(548 790) rotate(5)">
      <rect x="-19" y="-612" width="38" height="642" rx="17" fill="url(#culmLight)"/>
      <g stroke="#21371f" stroke-width="7">
        <path d="M-15 -532 H15"/><path d="M-15 -445 H15"/><path d="M-15 -353 H15"/><path d="M-15 -258 H15"/><path d="M-15 -161 H15"/><path d="M-15 -66 H15"/>
      </g>
    </g>
    <g transform="translate(612 784) rotate(7)">
      <rect x="-18" y="-555" width="36" height="585" rx="16" fill="url(#culm)"/>
      <g stroke="#21351f" stroke-width="7">
        <path d="M-15 -480 H15"/><path d="M-15 -397 H15"/><path d="M-15 -310 H15"/><path d="M-15 -219 H15"/><path d="M-15 -126 H15"/>
      </g>
    </g>
    <g transform="translate(669 773) rotate(10)">
      <rect x="-17" y="-485" width="34" height="518" rx="15" fill="url(#culmLight)"/>
      <g stroke="#233821" stroke-width="7">
        <path d="M-14 -420 H14"/><path d="M-14 -344 H14"/><path d="M-14 -266 H14"/><path d="M-14 -186 H14"/><path d="M-14 -102 H14"/>
      </g>
    </g>
  </g>

  <!-- branching stems -->
  <g stroke="#31452a" stroke-width="10" stroke-linecap="round" fill="none" opacity=".95">
    <path d="M405 318 Q352 276 303 269"/><path d="M411 390 Q356 360 316 370"/>
    <path d="M474 246 Q421 199 376 192"/><path d="M478 353 Q535 305 579 300"/>
    <path d="M548 293 Q603 251 654 251"/><path d="M548 405 Q601 369 655 383"/>
    <path d="M610 338 Q662 300 706 304"/><path d="M667 416 Q715 388 754 398"/>
    <path d="M348 472 Q303 440 270 448"/><path d="M608 500 Q668 470 718 481"/>
  </g>

  <!-- foliage masses -->
  <g filter="url(#soft)">
    <g transform="translate(284 250) rotate(-18)">
      <use href="#leafA" transform="translate(0 0) rotate(-18)"/>
      <use href="#leafB" transform="translate(25 -25) rotate(12)"/>
      <use href="#leafA" transform="translate(44 19) rotate(27) scale(.88)"/>
      <use href="#leafB" transform="translate(-8 28) rotate(6) scale(.9)"/>
    </g>
    <g transform="translate(360 172) rotate(-5)">
      <use href="#leafA" transform="translate(0 0) rotate(-16)"/>
      <use href="#leafB" transform="translate(29 -28) rotate(15)"/>
      <use href="#leafA" transform="translate(55 12) rotate(31) scale(.95)"/>
      <use href="#leafB" transform="translate(-12 31) rotate(2) scale(1.05)"/>
    </g>
    <g transform="translate(575 270) rotate(8)">
      <use href="#leafA" transform="translate(0 0) rotate(-15)"/>
      <use href="#leafB" transform="translate(34 -32) rotate(10) scale(1.1)"/>
      <use href="#leafA" transform="translate(54 20) rotate(28) scale(.9)"/>
      <use href="#leafB" transform="translate(-18 29) rotate(-8)"/>
    </g>
    <g transform="translate(650 231) rotate(13)">
      <use href="#leafA" transform="translate(0 0) rotate(-21)"/>
      <use href="#leafB" transform="translate(38 -27) rotate(16)"/>
      <use href="#leafA" transform="translate(63 16) rotate(33) scale(.86)"/>
    </g>
    <g transform="translate(286 420) rotate(-14)">
      <use href="#leafA" transform="translate(0 0) rotate(-18) scale(.92)"/>
      <use href="#leafB" transform="translate(37 -24) rotate(8)"/>
      <use href="#leafA" transform="translate(48 22) rotate(26) scale(.83)"/>
    </g>
    <g transform="translate(640 463) rotate(16)">
      <use href="#leafA" transform="translate(0 0) rotate(-19)"/>
      <use href="#leafB" transform="translate(36 -25) rotate(8) scale(1.08)"/>
      <use href="#leafA" transform="translate(62 18) rotate(24) scale(.9)"/>
    </g>
    <g transform="translate(694 377) rotate(20)">
      <use href="#leafA" transform="translate(0 0) rotate(-16) scale(.92)"/>
      <use href="#leafB" transform="translate(31 -27) rotate(12)"/>
      <use href="#leafA" transform="translate(57 19) rotate(30) scale(.82)"/>
    </g>
  </g>

  <!-- extra loose leaves for silhouette -->
  <g opacity=".98">
    <use href="#leafB" transform="translate(253 309) rotate(-52) scale(.9)"/>
    <use href="#leafB" transform="translate(289 333) rotate(18) scale(.85)"/>
    <use href="#leafB" transform="translate(720 328) rotate(-20) scale(.9)"/>
    <use href="#leafB" transform="translate(748 358) rotate(22) scale(.78)"/>
    <use href="#leafB" transform="translate(323 516) rotate(-35) scale(.75)"/>
    <use href="#leafB" transform="translate(688 542) rotate(20) scale(.82)"/>
  </g>

  <!-- clipped cut ends / base highlights -->
  <g fill="#8f9362" stroke="#263722" stroke-width="4" opacity=".9">
    <ellipse cx="343" cy="786" rx="18" ry="7"/><ellipse cx="408" cy="805" rx="20" ry="8"/>
    <ellipse cx="476" cy="815" rx="22" ry="9"/><ellipse cx="549" cy="819" rx="19" ry="8"/>
    <ellipse cx="613" cy="811" rx="18" ry="7"/><ellipse cx="670" cy="800" rx="17" ry="7"/>
  </g>
</svg>