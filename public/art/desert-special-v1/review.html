<main><h1>서역사막 보스 특별 원화 · 검토 시안</h1><p>게임 적용 전 원화입니다. 몸 크기·관절·무기와 접지점을 검토합니다. 같은 배율로 비교하며 자세별 맞춤 축소는 하지 않습니다.</p><p>왼쪽은 기본 대기, 오른쪽은 특별 모션입니다. 같은 원본 배율로 비교합니다. 준비 → 힘 싣기 → 판정 → 후속 → 회수 → 대기.</p><nav><label>보스 <select id="character"></select></label><label>패턴 <select id="move"></select></label><label>자세 <select id="pose"><option value="auto">시간에 따라 재생</option><option value="0">1 · 준비</option><option value="1">2 · 힘 싣기</option><option value="2">3 · 판정</option><option value="3">4 · 후속</option><option value="4">5 · 회수</option><option value="5">6 · 대기</option></select></label><button id="pause">일시 정지</button><button id="next">다음 프레임</button><label><input id="hold" type="checkbox">잡기·방어 유지</label></nav><p id="phase" aria-live="polite"></p><div id="grid"></div><p>빨간 표시는 실제 접촉 순간입니다. 발 접지점은 자동 제안이며 적용 전 검토가 필요합니다. HP바 높이는 기본·특별 전체 그림을 포함합니다.</p></main>
