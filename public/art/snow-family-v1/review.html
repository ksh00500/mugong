function sample(){const mode=document.querySelector('#mode').value;if(mode==='walk')return ['locomotion',[1,2,3,2][Math.floor(time/0.3)%4],'걷기'];if(mode==='idle')return ['locomotion',0,'대기'];if(mode==='hurt')return ['locomotion',time%0.8<0.14?4:0,'피격 후 대기'];if(mode==='death')return ['locomotion',5,'사망'];const p=time%3.15;if(p<0.4)return ['locomotion',0,'대기'];if(p<1.55)return ['combat',(p-0.4)/1.15<0.45?0:1,'공격 준비'];if(p<1.83){const s=(p-1.55)/0.28;return ['combat',s<0.18?1:s<0.48?2:3,'타격 / 발사'];}return ['combat',(p-1.83)/1.3<0.42?4:5,'회수'];}
function paint(){const [kind,pose,label]=sample();document.querySelector('#phase').textContent=label+' · 원화 '+(pose+1);canvases.forEach((canvas,index)=>{const ctx=canvas.getContext('2d'),d=directions[index],f=art.frames.find(f=>f.view===d.view&&f.kind===kind&&f.pose===pose);ctx.clearRect(0,0,500,350);const scale=art.pixelScale*2,groundX=250,groundY=285;ctx.fillStyle='#ddd5c0';ctx.beginPath();ctx.ellipse(groundX,groundY+3,32,8,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(groundX,groundY);ctx.scale(d.flip?-scale:scale,scale);ctx.drawImage(images.get(f.texture),f.x,f.y,f.width,f.height,-f.footX,-f.footY,f.width,f.height);ctx.restore();if(!(kind==='locomotion'&&pose===5)){ctx.fillStyle='#34463b';ctx.fillRect(groundX-40,groundY-art.healthClearance*2,80,5);ctx.fillStyle='#bb4939';ctx.fillRect(groundX-40,groundY-art.healthClearance*2,60,5);}ctx.strokeStyle='#b9baa7';ctx.beginPath();ctx.moveTo(20,groundY);ctx.lineTo(480,groundY);ctx.stroke();ctx.fillStyle='#465549';ctx.font='14px system-ui';ctx.fillText(f.name+' · 배율 0.45 고정',20,330);});}
function loop(now){const dt=Math.min(0.1,(now-last)/1000);last=now;if(!paused)time+=dt;paint();requestAnimationFrame(loop);}paint();requestAnimationFrame(loop);
</script></html>
