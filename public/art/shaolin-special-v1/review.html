function drawFrame(ctx,f,x,flipped){const image=images.get(f.texture);if(!image?.complete)return;const scale=.8;ctx.save();ctx.translate(x,340);ctx.scale(flipped?-1:1,1);ctx.drawImage(image,f.x,f.y,f.width,f.height,-f.footX*scale,-f.footY*scale,f.width*scale,f.height*scale);ctx.restore()}
function tick(now){if(running)time+=Math.min(.05,(now-last)/1000);last=now;const a=ART.characters[+character.value],m=move.value,t=TIMING[a.bossId][m],total=t.windup+t.duration+t.recovery+.25,age=time%total;let action,p;if(age<t.windup){action='windup';p=age/t.windup}else if(age<t.windup+t.duration){action='strike';p=(age-t.windup)/t.duration}else{action='recover';p=Math.min(1,(age-t.windup-t.duration)/t.recovery)}const motion=clock(m,action,p,t,hold.checked&&['grab','stance'].includes(m));document.querySelector('#phase').textContent=t.name+' · '+({prepare:'준비',load:'힘 싣기',contact:'판정',follow:'후속',return:'회수',ready:'대기',hold:'유지'})[motion.phase]+' · '+(motion.pose+1)+'/6'+(motion.contact>=0?' · '+(motion.contact+1)+'번째 접촉':'');
canvases.forEach((c,d)=>{const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#aa9670';ctx.beginPath();ctx.moveTo(0,340);ctx.lineTo(1200,340);ctx.stroke();const native=BASE.characters.find(b=>b.id===a.id),before=native.frames.find(f=>f.view===directions[d]&&f.kind==='locomotion'&&f.pose===0),f=a.frames.find(f=>f.view===directions[d]&&f.move===m&&f.pose===motion.pose);drawFrame(ctx,before,230,flip[d]);drawFrame(ctx,f,750,flip[d]);ctx.fillStyle=motion.phase==='contact'?'#b94330':'#365c48';ctx.fillRect(725,18,50,5)});requestAnimationFrame(tick)}requestAnimationFrame(tick);
