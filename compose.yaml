name: mugong
services:
  web:
    image: mugong:${MUGONG_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MUGONG_BIND:-127.0.0.1}:${MUGONG_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
